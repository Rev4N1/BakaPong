name: Test All Builds

on:
  workflow_dispatch:
    inputs:
      bakasu_ref:
        description: "BakaSU tag or commit (empty = last commit tested with SUSFS, main = latest)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default Build (LineageOS)
          - name: LineageOS
            kernel_type: LineageOS
            kernel_repo: https://github.com/LineageOS/android_kernel_nothing_sm8475.git
            kernel_branch: lineage-23.2
            kernel_defconfig: gki_defconfig
            extra_configs: vendor/waipio_GKI.config vendor/nothing/waipio_GKI.config vendor/debugfs.config
            extra_patches_dir: ''
            susfs_support: true
            bbg_support: false
            susfs_force: false

    uses: ./.github/workflows/build.yml
    with:
      kernel_type: ${{ matrix.kernel_type }}
      kernel_repo: ${{ matrix.kernel_repo }}
      kernel_branch: ${{ matrix.kernel_branch }}
      kernel_defconfig: ${{ matrix.kernel_defconfig }}
      extra_configs: ${{ matrix.extra_configs }}
      extra_patches_dir: ${{ matrix.extra_patches_dir }}
      susfs_support: ${{ matrix.susfs_support }}
      bbg_support: ${{ matrix.bbg_support }}
      susfs_force: ${{ matrix.susfs_force }}
      bakasu_ref: ${{ inputs.bakasu_ref }}
