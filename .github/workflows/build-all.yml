name: Test All Builds

on:
  workflow_dispatch:
    inputs:
      bakasu_ref:
        description: "BakaSU branch, tag or commit (empty = main)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # kernel_type names the zip and artifacts, so each variant must differ
          - name: LineageOS (base)
            kernel_type: LineageOS
            kernel_repo: https://github.com/LineageOS/android_kernel_nothing_sm8475.git
            kernel_branch: lineage-23.2
            kernel_defconfig: gki_defconfig
            extra_configs: vendor/waipio_GKI.config vendor/nothing/waipio_GKI.config vendor/debugfs.config
            extra_patches_dir: ''
            susfs_support: true
            bbg_support: false
            susfs_force: false
            amneziawg_support: false
            droidspaces_support: false
            droidspaces_resource_limits: false
          - name: LineageOS + AmneziaWG
            kernel_type: LineageOS-AWG
            kernel_repo: https://github.com/LineageOS/android_kernel_nothing_sm8475.git
            kernel_branch: lineage-23.2
            kernel_defconfig: gki_defconfig
            extra_configs: vendor/waipio_GKI.config vendor/nothing/waipio_GKI.config vendor/debugfs.config
            extra_patches_dir: ''
            susfs_support: true
            bbg_support: false
            susfs_force: false
            amneziawg_support: true
            droidspaces_support: false
            droidspaces_resource_limits: false
          - name: LineageOS + Droidspaces
            kernel_type: LineageOS-DS
            kernel_repo: https://github.com/LineageOS/android_kernel_nothing_sm8475.git
            kernel_branch: lineage-23.2
            kernel_defconfig: gki_defconfig
            extra_configs: vendor/waipio_GKI.config vendor/nothing/waipio_GKI.config vendor/debugfs.config
            extra_patches_dir: ''
            susfs_support: true
            bbg_support: false
            susfs_force: false
            amneziawg_support: false
            droidspaces_support: true
            droidspaces_resource_limits: false
          - name: LineageOS + AmneziaWG + Droidspaces
            kernel_type: LineageOS-AWG-DS
            kernel_repo: https://github.com/LineageOS/android_kernel_nothing_sm8475.git
            kernel_branch: lineage-23.2
            kernel_defconfig: gki_defconfig
            extra_configs: vendor/waipio_GKI.config vendor/nothing/waipio_GKI.config vendor/debugfs.config
            extra_patches_dir: ''
            susfs_support: true
            bbg_support: false
            susfs_force: false
            amneziawg_support: true
            droidspaces_support: true
            droidspaces_resource_limits: false
    uses: ./.github/workflows/build.yml
    with:
      kernel_type: ${{ matrix.kernel_type }}
      kernel_repo: ${{ matrix.kernel_repo }}
      kernel_branch: ${{ matrix.kernel_branch }}
      kernel_defconfig: ${{ matrix.kernel_defconfig }}
      extra_configs: ${{ matrix.extra_configs }}
      extra_patches_dir: ${{ matrix.extra_patches_dir }}
      susfs_support: ${{ matrix.susfs_support }}
      bbg_support: ${{ matrix.bbg_support }}
      susfs_force: ${{ matrix.susfs_force }}
      amneziawg_support: ${{ matrix.amneziawg_support }}
      droidspaces_support: ${{ matrix.droidspaces_support }}
      droidspaces_resource_limits: ${{ matrix.droidspaces_resource_limits }}
      bakasu_ref: ${{ inputs.bakasu_ref }}
